<svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E5FCC"/>
    </marker>
  </defs>
  <rect width="1100" height="480" fill="#F2F7FF"/>
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0B3D91">GreenEye — Hardware Wiring Overview</text>

  <!-- Imaging side -->
  <text x="60" y="80" font-size="15" font-weight="bold" fill="#0B3D91">Imaging Unit</text>
  <rect x="40" y="95" width="170" height="80" rx="10" fill="#0B3D91"/>
  <text x="125" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ESP32-CAM</text>
  <text x="125" y="146" text-anchor="middle" font-size="11" fill="#BBDEFB">OV2640 sensor</text>
  <text x="125" y="160" text-anchor="middle" font-size="11" fill="#BBDEFB">Wi-Fi image upload</text>

  <rect x="250" y="95" width="170" height="80" rx="10" fill="#1E5FCC"/>
  <text x="335" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">FTDI Programmer</text>
  <text x="335" y="148" text-anchor="middle" font-size="11" fill="#E3F2FD">5V / GND / TX↔U0R</text>
  <text x="335" y="163" text-anchor="middle" font-size="11" fill="#E3F2FD">RX↔U0T (flashing only)</text>

  <line x1="210" y1="135" x2="248" y2="135" stroke="#1E5FCC" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Irrigation side -->
  <text x="60" y="230" font-size="15" font-weight="bold" fill="#0B3D91">Irrigation Unit</text>

  <rect x="40" y="245" width="170" height="80" rx="10" fill="#2E7BE9"/>
  <text x="125" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ESP32 NodeMCU</text>
  <text x="125" y="298" text-anchor="middle" font-size="11" fill="#E3F2FD">GPIO signal out</text>
  <text x="125" y="312" text-anchor="middle" font-size="11" fill="#E3F2FD">5V powered</text>

  <rect x="260" y="245" width="170" height="80" rx="10" fill="#42A5F5"/>
  <text x="345" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B3D91">Relay Module</text>
  <text x="345" y="298" text-anchor="middle" font-size="11" fill="#0B3D91">Switches 12V line</text>
  <text x="345" y="312" text-anchor="middle" font-size="11" fill="#0B3D91">NO/COM to pump</text>

  <rect x="480" y="245" width="170" height="80" rx="10" fill="#90CAF9"/>
  <text x="565" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B3D91">12V DC Pump</text>
  <text x="565" y="298" text-anchor="middle" font-size="11" fill="#0B3D91">Waters plant</text>
  <text x="565" y="312" text-anchor="middle" font-size="11" fill="#0B3D91">on relay trigger</text>

  <rect x="700" y="245" width="170" height="80" rx="10" fill="#64B5F6"/>
  <text x="785" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B3D91">12V Adapter</text>
  <text x="785" y="298" text-anchor="middle" font-size="11" fill="#0B3D91">Powers pump</text>
  <text x="785" y="312" text-anchor="middle" font-size="11" fill="#0B3D91">circuit only</text>

  <line x1="210" y1="285" x2="258" y2="285" stroke="#1E5FCC" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="430" y1="285" x2="478" y2="285" stroke="#1E5FCC" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="700" y1="285" x2="652" y2="285" stroke="#1E5FCC" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Power note -->
  <rect x="40" y="380" width="830" height="60" rx="10" fill="#FFFFFF" stroke="#90CAF9" stroke-width="2"/>
  <text x="60" y="405" font-size="12" fill="#0B3D91" font-weight="bold">Power Notes:</text>
  <text x="60" y="425" font-size="12" fill="#5C7CA5">ESP32-CAM and NodeMCU run on a shared 5V source; the relay/pump circuit uses an isolated 12V adapter to avoid back-feeding the logic side.</text>
</svg>
