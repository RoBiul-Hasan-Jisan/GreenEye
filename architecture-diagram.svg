<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E5FCC"/>
    </marker>
  </defs>
  <rect width="1100" height="420" fill="#F2F7FF"/>
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#0B3D91">GreenEye — System Architecture</text>

  <!-- Node template -->
  <!-- ESP32-CAM -->
  <rect x="40" y="90" width="190" height="90" rx="12" fill="#0B3D91"/>
  <text x="135" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">ESP32-CAM</text>
  <text x="135" y="150" text-anchor="middle" font-size="12" fill="#BBDEFB">Captures leaf image</text>

  <!-- Automation script -->
  <rect x="300" y="90" width="200" height="90" rx="12" fill="#1E5FCC"/>
  <text x="400" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Automation Script</text>
  <text x="400" y="144" text-anchor="middle" font-size="12" fill="#E3F2FD">Wi-Fi trigger + fetch photo</text>
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#E3F2FD">Uploads via API key</text>

  <!-- Flask server -->
  <rect x="570" y="90" width="200" height="90" rx="12" fill="#2E7BE9"/>
  <text x="670" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Flask Server</text>
  <text x="670" y="144" text-anchor="middle" font-size="12" fill="#E3F2FD">Auth + API</text>
  <text x="670" y="160" text-anchor="middle" font-size="12" fill="#E3F2FD">Stores predictions (DB)</text>

  <!-- Dashboard -->
  <rect x="840" y="90" width="200" height="90" rx="12" fill="#1565C0"/>
  <text x="940" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Web Dashboard</text>
  <text x="940" y="144" text-anchor="middle" font-size="12" fill="#E3F2FD">History, analytics,</text>
  <text x="940" y="160" text-anchor="middle" font-size="12" fill="#E3F2FD">confidence scores</text>

  <!-- AI pipeline block below Flask -->
  <rect x="500" y="250" width="340" height="120" rx="12" fill="#FFFFFF" stroke="#1E5FCC" stroke-width="2"/>
  <text x="670" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B3D91">3-Stage AI Pipeline</text>
  <rect x="520" y="290" width="90" height="55" rx="8" fill="#90CAF9"/>
  <text x="565" y="313" text-anchor="middle" font-size="11" fill="#0B3D91">Leaf</text>
  <text x="565" y="327" text-anchor="middle" font-size="11" fill="#0B3D91">Detection</text>

  <rect x="625" y="290" width="90" height="55" rx="8" fill="#64B5F6"/>
  <text x="670" y="313" text-anchor="middle" font-size="11" fill="#0B3D91">Health</text>
  <text x="670" y="327" text-anchor="middle" font-size="11" fill="#0B3D91">Classification</text>

  <rect x="730" y="290" width="90" height="55" rx="8" fill="#42A5F5"/>
  <text x="775" y="313" text-anchor="middle" font-size="11" fill="#FFFFFF">Disease</text>
  <text x="775" y="327" text-anchor="middle" font-size="11" fill="#FFFFFF">ID (40+)</text>

  <!-- Arrows top row -->
  <line x1="230" y1="135" x2="298" y2="135" stroke="#1E5FCC" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="135" x2="568" y2="135" stroke="#1E5FCC" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="135" x2="838" y2="135" stroke="#1E5FCC" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrow down from server to pipeline -->
  <line x1="670" y1="180" x2="670" y2="248" stroke="#1E5FCC" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="550" y="400" text-anchor="middle" font-size="13" fill="#5C7CA5">ESP32 NodeMCU + relay + pump form a separate irrigation control loop, triggered by server commands.</text>
</svg>
